[tox]
envlist = py39, py310, py311, py312, py313, py314

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/tests
deps =
    pytest
    responses
    mock
commands =
    pytest tests/ {posargs}

[testenv:style]
deps =
    flake8
commands =
    flake8 check_pa

[testenv:docs]
changedir = docs/
deps =
    sphinx
commands =
    sphinx-build -b linkcheck ./ _build/
    sphinx-build -b html ./ _build/
